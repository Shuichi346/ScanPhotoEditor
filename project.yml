name: ScanPhotoEditor
options:
  bundleIdPrefix: com.shuichi
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.5"
  createIntermediateGroups: true
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_APP_SANDBOX: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  ScanPhotoEditor:
    type: application
    platform: macOS
    sources:
      - path: ScanPhotoEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuichi.ScanPhotoEditor
        PRODUCT_NAME: ScanPhotoEditor
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: ScanPhotoEditor/Support/ScanPhotoEditor.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ScanPhotoEditor/Support/Info.plist
    entitlements:
      path: ScanPhotoEditor/Support/ScanPhotoEditor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    scheme:
      testTargets:
        - ScanPhotoEditorTests
        - ScanPhotoEditorUITests
  ScanPhotoEditorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ScanPhotoEditorTests
    dependencies:
      - target: ScanPhotoEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuichi.ScanPhotoEditorTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ScanPhotoEditor.app/Contents/MacOS/ScanPhotoEditor"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ScanPhotoEditorUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ScanPhotoEditorUITests
    dependencies:
      - target: ScanPhotoEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuichi.ScanPhotoEditorUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ScanPhotoEditor
